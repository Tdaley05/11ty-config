<!doctype html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport"
           content="width=device-width,
           user-scalable=no,
           initial-scale=1.0,
           maximum-scale=1.0,
           minimum-scale=1.0">
     <meta http-equiv="X-UA-Compatible"
           content="ie=edge">
     <title></title>
     <link rel="stylesheet" href="css/styles.css">
     <script type="module" src="js/is-land.js"></script>

</head>
<body>

    <p>Please press a button to choose a topical set of images.</p>


<is-land on:visible>
  <div id="gallery" v-scope="{ active: 'all' }">
    <div class="filters">
      <button @click="active = 'all'" :class="{ on: active === 'all' }" :aria-pressed="active === 'all'">All</button>
      
      <button @click="active = 'Media'" :class="{ on: active === 'Media' }" :aria-pressed="active === 'Media'">Media</button>
      
      <button @click="active = 'Stores'" :class="{ on: active === 'Stores' }" :aria-pressed="active === 'Stores'">Stores</button>
      
      <button @click="active = 'Tech'" :class="{ on: active === 'Tech' }" :aria-pressed="active === 'Tech'">Tech</button>
      
    </div>
    <p aria-live="polite">Showing: <span v-text="active"></span></p>
    
    <section class="topic" v-show="active === 'all' || active === 'Media'">
      <h3>Media</h3>
      <div class="row">
        
        <figure>
          <img src="img/Media/cds.jpg" alt="A small display stack of CDs">
          <figcaption>Stack of CDs</figcaption>
        </figure>
        
        <figure>
          <img src="img/Media/shelf.jpg" alt="A bookcase of books and games as well as figurines">
          <figcaption>Shelves of media and figurines</figcaption>
        </figure>
        
      </div>
    </section>
    
    <section class="topic" v-show="active === 'all' || active === 'Stores'">
      <h3>Stores</h3>
      <div class="row">
        
        <figure>
          <img src="img/Stores/exchange.jpg" alt="The Exchange in Pittsburgh, Pennsylvania">
          <figcaption>The Exhange</figcaption>
        </figure>
        
        <figure>
          <img src="img/Stores/vincent.jpg" alt="St Vincent DePaul&#39;s Thrift Store in Pittsburgh, Pennsylvania">
          <figcaption>Thrift Store</figcaption>
        </figure>
        
      </div>
    </section>
    
    <section class="topic" v-show="active === 'all' || active === 'Tech'">
      <h3>Tech</h3>
      <div class="row">
        
        <figure>
          <img src="img/Tech/cdplayer.jpg" alt="philips mc235 cd player">
          <figcaption>Philips MC235(B?) CD Player</figcaption>
        </figure>
        
        <figure>
          <img src="img/Tech/dvdburner.jpg" alt="Son DVD burner">
          <figcaption>DVD Burner</figcaption>
        </figure>
        
        <figure>
          <img src="img/Tech/VhsPlayer.jpg" alt="Vhs Player">
          <figcaption>Vhs Player</figcaption>
        </figure>
        
      </div>
    </section>
    
  </div>

  <template data-island>
    <script type="module">
      import { createApp } from './js/petite-vue.js'
      createApp().mount('#gallery')
    </script>
  </template>
</is-land>
<nav>
  <a href="index.html">Home</a>
  <a href="guide.html">Guide</a>
  <a href="gallery-auto.html">Gallery</a>
</nav>


<strong>Page last updated:</strong>

  <time class="fmt-date" datetime="2026-11-19T10:31:41-05:00">2026-11-19T10:31:41-05:00</time>

<strong>Site last built:</strong>
<time class="fmt-date" datetime="2026-11-19T16:09:35.383Z">2026-11-19T16:09:35.383Z</time>

<is-land on:visible>
  <template data-island>
    <script type="module">
      const fmt = new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
      });
      document.querySelectorAll("time.fmt-date").forEach((el) => {
        el.textContent = fmt.format(new Date(el.getAttribute("datetime")));
      });
    </script>
  </template>
</is-land>


</body>
</html>
